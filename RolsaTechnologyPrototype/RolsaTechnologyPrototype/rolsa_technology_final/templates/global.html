<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <title>{% block title %}{% endblock title %}</title>
  <!--Adding a favicon -->
  <link rel="icon" type="png/svg" href="{% static 'images/favicon.svg' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'global.css' %}">
  <!-- Adding bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!--Adding jQuery javascript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
    integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="{% static 'scripts/jquery.js' %}"></script>
  <!-- Allows for custom stylesheets -->
  {% block head %}
  {% endblock head %}
</head>

<body style="background: #E8F2DA;">
  <!--Global Header-->
  <nav class="navbar navbar-expand-sm" id="nav">
    <div class="container-fluid">
      <!--Header links and branding-->
      <h1 class="navbar-branding">Rolsa Technologies</h1>
      <ul class="navbar-nav" id="nav-links">
        <li class="nav-item"><a href="{% url 'index' %}" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="{% url 'articles' %}" class="nav-link">Articles</a></li>
        <li class="nav-item"><a href="{% url 'energyusage' %}" class="nav-link">Calculate Energy Usage</a></li>
      </ul>
    </div>
    <!--The login link and the settings dropdown menu-->
    <ul class="pfp-settings">
      <li><a href="{% url 'login' %}"><svg xmlns="http://www.w3.org/2000/svg" width="45" height="45"
            class="bi bi-person-circle" viewBox="0 0 16 16">
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
            <path fill-rule="evenodd"
              d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
          </svg></a></li>
      <li>
        <!--Establishing the dropdown menu as an actual dropdown-->
        <div class="dropdown dropstart">
          <button type="button" class="btn btn-dropdown" data-bs-toggle="dropdown" id="sett"><svg
              xmlns="http://www.w3.org/2000/svg" width="45" height="45" class="bi bi-gear-wide" viewBox="0 0 16 16">
              <path
                d="M8.932.727c-.243-.97-1.62-.97-1.864 0l-.071.286a.96.96 0 0 1-1.622.434l-.205-.211c-.695-.719-1.888-.03-1.613.931l.08.284a.96.96 0 0 1-1.186 1.187l-.284-.081c-.96-.275-1.65.918-.931 1.613l.211.205a.96.96 0 0 1-.434 1.622l-.286.071c-.97.243-.97 1.62 0 1.864l.286.071a.96.96 0 0 1 .434 1.622l-.211.205c-.719.695-.03 1.888.931 1.613l.284-.08a.96.96 0 0 1 1.187 1.187l-.081.283c-.275.96.918 1.65 1.613.931l.205-.211a.96.96 0 0 1 1.622.434l.071.286c.243.97 1.62.97 1.864 0l.071-.286a.96.96 0 0 1 1.622-.434l.205.211c.695.719 1.888.03 1.613-.931l-.08-.284a.96.96 0 0 1 1.187-1.187l.283.081c.96.275 1.65-.918.931-1.613l-.211-.205a.96.96 0 0 1 .434-1.622l.286-.071c.97-.243.97-1.62 0-1.864l-.286-.071a.96.96 0 0 1-.434-1.622l.211-.205c.719-.695.03-1.888-.931-1.613l-.284.08a.96.96 0 0 1-1.187-1.186l.081-.284c.275-.96-.918-1.65-1.613-.931l-.205.211a.96.96 0 0 1-1.622-.434zM8 12.997a4.998 4.998 0 1 1 0-9.995 4.998 4.998 0 0 1 0 9.996z" />
            </svg></button>
          <!--the dropdown items and svgs-->
          <ul class="dropdown-menu" id="menu">
            <li class="dropdown-item"><button id="text-increase"><svg xmlns="http://www.w3.org/2000/svg" width="10"
                  height="10" class="bi bi-arrow-90deg-up" viewBox="0 0 16 16">
                  <path fill-rule="evenodd"
                    d="M4.854 1.146a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L4 2.707V12.5A2.5 2.5 0 0 0 6.5 15h8a.5.5 0 0 0 0-1h-8A1.5 1.5 0 0 1 5 12.5V2.707l3.146 3.147a.5.5 0 1 0 .708-.708z" />
                </svg>Increase the font size</button></li>
            <li class="dropdown-item"><button id="text-decrease"><svg xmlns="http://www.w3.org/2000/svg" width="10"
                  height="10" class="bi bi-arrow-90deg-down" viewBox="0 0 16 16">
                  <path fill-rule="evenodd"
                    d="M4.854 14.854a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V3.5A2.5 2.5 0 0 1 6.5 1h8a.5.5 0 0 1 0 1h-8A1.5 1.5 0 0 0 5 3.5v9.793l3.146-3.147a.5.5 0 0 1 .708.708z" />
                </svg>Decrease the font size</button></li>
            <li class="dropdown-item"><button id="reset"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"
                  class="bi bi-arrow-repeat" viewBox="0 0 16 16">
                  <path
                    d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41m-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9" />
                  <path fill-rule="evenodd"
                    d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5 5 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z" />
                </svg>Reset the font size</button></li>
            <li class="dropdown-item">
              <!--intialising the switch for the light/dark mode-->
              <div class="form-check form-switch">
                <input type="checkbox" class="form-check-input" role="switch" id="darkmode-switch">
                <label for="darkmode-switch">Toggle Mode</label>
              </div>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>
  <!-- Main content will go here -->
  <div class="main">
    {% block content %}
    {% endblock content %}
  </div>
  <!--Removed Footer as I realised clashes would be imminent as different pages have different needs-->
  <!-- Adding Bootstrap Javascript and global JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="{% static 'scripts/global.js' %}"></script>
</body>

</html>
